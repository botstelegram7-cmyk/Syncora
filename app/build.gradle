plugins {
    id 'com.android.application'
}

// Releases are signed with the key in signing/ so every new APK can be installed over the previous one.
// CI (or you) can override it with SYNCORA_KEYSTORE_PATH / _PASSWORD / SYNCORA_KEY_ALIAS / SYNCORA_KEY_PASSWORD.
def envKeystore = System.getenv('SYNCORA_KEYSTORE_PATH')

android {
    namespace 'com.serena.syncora'
    compileSdk 35

    defaultConfig {
        applicationId 'com.serena.syncora'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }

    signingConfigs {
        sideload {
            if (envKeystore) {
                storeFile file(envKeystore)
                storePassword System.getenv('SYNCORA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SYNCORA_KEY_ALIAS') ?: 'syncora'
                keyPassword System.getenv('SYNCORA_KEY_PASSWORD')
            } else {
                storeFile rootProject.file('signing/syncora-sideload.jks')
                storePassword 'syncora-sideload'
                keyAlias 'syncora'
                keyPassword 'syncora-sideload'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.viewpager:viewpager:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
