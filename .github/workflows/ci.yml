name: CI (build, tests, emulator UI check)

on:
  push:
    branches:
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee tests.log

      - name: Explain test failures
        if: failure()
        run: python3 .github/scripts/annotate_log.py tests.log "Unit tests failed"

      - name: Build the debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Explain build failures
        if: failure()
        run: python3 .github/scripts/annotate_log.py build.log "Debug build failed"

      - name: Android lint (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon lintDebug 2>&1 | tee lint.log || true
          python3 - <<'PY'
          import glob, re
          for f in glob.glob('app/build/reports/lint-results-debug.txt'):
              text = open(f, encoding='utf-8', errors='replace').read()
              errors = re.findall(r'^(.*?): Error: (.*?) \[(\w+)\]', text, re.M)
              warns = re.findall(r'^(.*?): Warning: (.*?) \[(\w+)\]', text, re.M)
              print('lint errors:', len(errors), 'warnings:', len(warns))
              body = '\n'.join('%s: %s [%s]' % e for e in errors[:25]) or 'no lint errors'
              body = body.replace('%', '%25').replace('\n', '%0A')
              print('::notice title=Lint errors (%d)::%s' % (len(errors), body[:3500]))
          PY

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # The emulator tour takes ~8 minutes: run it on demand ("[emulator]" in the commit message, or run the workflow by hand).
  emulator:
    needs: build
    if: contains(github.event.head_commit.message, '[emulator]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/download-artifact@v8.0.0
        with:
          name: debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Python imaging for screenshots
        run: python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow || pip install --quiet pillow

      - name: Run the app on an emulator
        env:
          # screenshots and logs are only committed back to the branch when the commit message contains "[ci-shots]"
          CI_SHOTS: ${{ contains(github.event.head_commit.message, '[ci-shots]') && '1' || '' }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: timeout 1080 bash .github/scripts/emulator-smoke.sh apk/app-debug.apk

      - name: Publish screenshots and logs to the branch
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[ci-shots]')
        run: |
          if [ -d ci-output ]; then
            git config user.name "syncora-ci"
            git config user.email "ci@users.noreply.github.com"
            git add -f ci-output
            git commit -m "CI: emulator screenshots and logs [skip ci]" || exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push CI output"
          fi
