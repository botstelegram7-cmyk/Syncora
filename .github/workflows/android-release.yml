name: Android build and release

on:
  push:
    branches:
      - arena/29675cba-syncora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v7

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Stage APK with a friendly name
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Syncora-v0.1.0-debug.apk

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Syncora-v0.1.0-debug
          path: app/build/outputs/apk/debug/Syncora-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.0
          name: Syncora v0.1.0
          target_commitish: ${{ github.sha }}
          body_path: .github/RELEASE_NOTES.md
          files: app/build/outputs/apk/debug/Syncora-v0.1.0-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
